
name: Calculator CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gokul3031/python-calculator:${{ github.sha }}
            ghcr.io/gokul3031/python-calculator:latest

  production:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: production

    concurrency:
      group: calculator-production
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Kubernetes deployment image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          sed -i \
            "s|image: ghcr.io/gokul3031/python-calculator:.*|image: ghcr.io/gokul3031/python-calculator:${IMAGE_TAG}|" \
            k8s/deployment.yaml

          grep "image:" k8s/deployment.yaml

      - name: Commit updated manifest
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy image ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
