
name: Calculator CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

jobs:
  build-update-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gokul3031/python-calculator:${{ github.sha }}
            ghcr.io/gokul3031/python-calculator:latest

      - name: Update Kubernetes deployment image
        run: |
          sed -i \
            "s|image: ghcr.io/gokul3031/python-calculator:.*|image: ghcr.io/gokul3031/python-calculator:${IMAGE_TAG}|" \
            k8s/deployment.yaml

          grep "image:" k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy image ${IMAGE_TAG}"
            git push
          fi

      - name: Keep only the latest 2 GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: python-calculator
          package-type: container
          owner: Gokul3031
          token: ${{ secrets.GHCR_DELETE_TOKEN }}
          min-versions-to-keep: 2
          num-old-versions-to-delete: 1

       
