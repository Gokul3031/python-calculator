apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-calculator
  namespace: calci
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - calci
  selector:
    matchLabels:
      app: python-calculator
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
