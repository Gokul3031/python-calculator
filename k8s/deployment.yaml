apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-calculator
  namespace: calci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-calculator
  template:
    metadata:
      labels:
        app: python-calculator
    spec:
      containers:
        - name: python-calculator
          image: ghcr.io/gokul3031/python-calculator:5e876c0d0edc4aa0891b115b9b5d38b1b766f3c1
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      livenessProbe:
        httpGet:
          path: /healthz
          port: 5000
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 5000
        initialDelaySeconds: 
        periodSeconds: 5
