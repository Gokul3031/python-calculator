
apiVersion: v1
kind: Service
metadata:
  name: python-calculator
  namespace: calci
  labels:
    app: python-calculator

spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: python-calculator
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
